<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina AI</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Marked.js for parsing Markdown formatting (bold, lists, code) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #0f1117;
      --sidebar-bg: #161822;
      --card-bg: #1e202e;
      --border-color: #2a2d3d;
      --primary: #10b981;
      --primary-hover: #059669;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --user-bubble: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { display: flex; height: 100vh; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; }

    /* Sidebar Styling */
    .sidebar { width: 280px; background-color: var(--sidebar-bg); display: flex; flex-direction: column; padding: 16px; border-right: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 20px; padding: 0 4px; }
    .new-chat-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--primary); border: none; color: #fff; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: background 0.2s ease; width: 100%; }
    .new-chat-btn:hover { background-color: var(--primary-hover); }
    
    .history-title { font-size: 0.75rem; color: var(--text-muted); margin: 20px 4px 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .history-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; transition: all 0.2s ease; }
    .history-item:hover, .history-item.active { background-color: var(--card-bg); color: var(--text-main); }
    .delete-btn { color: var(--text-muted); opacity: 0; transition: opacity 0.2s; }
    .history-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #ef4444; }

    /* Main Chat Layout */
    .main-container { flex: 1; display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-dark); }
    .header { padding: 16px 24px; font-size: 1.1rem; font-weight: 600; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background-color: rgba(15, 17, 23, 0.8); backdrop-filter: blur(8px); }
    
    .chat-box { flex: 1; overflow-y: auto; padding: 24px 18%; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
    .message-row { display: flex; gap: 16px; width: 100%; animation: fadeIn 0.3s ease-in-out; }
    
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; flex-shrink: 0; }
    .user-avatar { background-color: var(--user-bubble); color: #fff; }
    .bot-avatar { background-color: var(--primary); color: #fff; }
    
    .message-content { flex: 1; font-size: 0.98rem; line-height: 1.6; color: var(--text-main); }
    .message-content p { margin-bottom: 12px; }
    .message-content p:last-child { margin-bottom: 0; }
    .message-content ul, .message-content ol { margin-left: 20px; margin-bottom: 12px; }
    .message-content code { background-color: rgba(255, 255, 255, 0.1); padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 0.9em; }
    .message-content pre { background-color: #0d0e14; padding: 14px; border-radius: 8px; overflow-x: auto; margin-bottom: 12px; border: 1px solid var(--border-color); }
    .message-content pre code { background: transparent; padding: 0; }

    /* Input Box Area */
    .input-container { padding: 16px 18% 24px; background: linear-gradient(180deg, transparent 0%, var(--bg-dark) 40%); }
    .input-wrapper { display: flex; align-items: flex-end; background-color: var(--card-bg); border-radius: 14px; padding: 12px 16px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25); transition: border-color 0.2s; }
    .input-wrapper:focus-within { border-color: var(--primary); }
    
    textarea { flex: 1; background: transparent; border: none; color: #fff; outline: none; resize: none; font-size: 1rem; max-height: 180px; min-height: 24px; line-height: 1.5; }
    .send-btn { background: var(--primary); border: none; color: white; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: 10px; transition: background 0.2s ease; }
    .send-btn:hover { background: var(--primary-hover); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2d3d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b3f54; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="brand">
      <i class="fa-solid fa-sparkles"></i> Lumina AI
    </div>
    <button class="new-chat-btn" onclick="createNewChat()">
      <i class="fa-solid fa-plus"></i> New chat
    </button>
    <div class="history-title">Recent Conversations</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <div class="header">
      <span><i class="fa-solid fa-graduation-cap" style="color: var(--primary); margin-right: 8px;"></i> MITS Assistant</span>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-container">
      <div class="input-wrapper">
        <textarea id="userInput" rows="1" placeholder="Ask Lumina anything..." onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

<script>
  let sessions = JSON.parse(localStorage.getItem("lumina_chats") || "[]");
  let currentSessionId = localStorage.getItem("lumina_active_id") || null;

  function init() {
    if (sessions.length === 0 || !currentSessionId) {
      createNewChat();
    } else {
      renderSidebar();
      renderChat();
    }
  }

  function save() {
    localStorage.setItem("lumina_chats", JSON.stringify(sessions));
    localStorage.setItem("lumina_active_id", currentSessionId);
  }

  function createNewChat() {
    const newSession = {
      id: Date.now().toString(),
      title: "New Conversation",
      messages: [{ sender: "bot", text: "Hello! I am Lumina. How can I assist you with your studies today?" }]
    };
    sessions.unshift(newSession);
    currentSessionId = newSession.id;
    save();
    renderSidebar();
    renderChat();
  }

  function selectChat(id) {
    currentSessionId = id;
    save();
    renderSidebar();
    renderChat();
  }

  function deleteChat(e, id) {
    e.stopPropagation();
    sessions = sessions.filter(s => s.id !== id);
    if (currentSessionId === id) {
      currentSessionId = sessions.length > 0 ? sessions[0].id : null;
    }
    if (!currentSessionId) {
      createNewChat();
    } else {
      save();
      renderSidebar();
      renderChat();
    }
  }

  function getCurrentSession() {
    return sessions.find(s => s.id === currentSessionId);
  }

  function renderSidebar() {
    const list = document.getElementById("historyList");
    list.innerHTML = "";
    sessions.forEach(s => {
      const item = document.createElement("div");
      item.className = `history-item ${s.id === currentSessionId ? "active" : ""}`;
      item.onclick = () => selectChat(s.id);
      item.innerHTML = `
        <span><i class="fa-regular fa-message" style="margin-right:8px;"></i>${s.title}</span>
        <i class="fa-solid fa-trash delete-btn" onclick="deleteChat(event, '${s.id}')"></i>
      `;
      list.appendChild(item);
    });
  }

  function renderChat() {
    const chatBox = document.getElementById("chatBox");
    chatBox.innerHTML = "";
    const session = getCurrentSession();
    if (!session) return;

    session.messages.forEach(msg => {
      const row = document.createElement("div");
      row.className = "message-row";
      const isUser = msg.sender === "user";
      
      // Parse markdown formatting for bot responses
      const formattedText = isUser ? escapeHtml(msg.text) : marked.parse(msg.text);

      row.innerHTML = `
        <div class="avatar ${isUser ? "user-avatar" : "bot-avatar"}">
          ${isUser ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>'}
        </div>
        <div class="message-content">${formattedText}</div>
      `;
      chatBox.appendChild(row);
    });
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
  }

  async function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    const session = getCurrentSession();
    if (session.messages.length === 1 && session.messages[0].sender === "bot") {
      session.title = text.length > 22 ? text.substring(0, 22) + "..." : text;
    }

    session.messages.push({ sender: "user", text });
    input.value = "";
    input.style.height = "auto";
    renderChat();
    save();
    renderSidebar();

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ history: session.messages }),
      });
      
      const data = await response.json();

      if (!response.ok) {
        session.messages.push({ 
          sender: "bot", 
          text: `Error (${response.status}): ${data.error || "Failed to reach Gemini API."}` 
        });
      } else {
        session.messages.push({ 
          sender: "bot", 
          text: data.text || "No response received." 
        });
      }
    } catch (err) {
      session.messages.push({ sender: "bot", text: "Unable to connect to local server." });
    }

    save();
    renderChat();
  }

  function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(textarea) {
    textarea.style.height = "auto";
    textarea.style.height = textarea.scrollHeight + "px";
  }

  init();
</script>
</body>
</html>
